name: ci.yml
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
      - 'README.md'
      - 'docs/**'
  workflow-dispatch:

jobs:
  build-and-test:
    name: Build, Lint and Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java-version: [21]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        if: runner.os != 'windows'
        run: chmod +x gradlew

      - name: Run Scalafmt and Spotbugs (Check)
        run: ./gradlew check

      - name: Run Tests
        run: ./gradlew test

